[package]
name = "pico-autofill"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[lib]
test = true

[[bin]]
name = "pico-autofill"
path = "src/main.rs"
test = false
bench = false

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = "0.7.9"
cortex-m-rt = "0.7.6"
embassy-executor = { version = "0.10.0", features = ["executor-thread", "platform-cortex-m"] }
embassy-futures = "0.1.2"
embassy-rp = { version = "0.10.0", features = ["critical-section-impl", "rp2040", "time-driver"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
panic-halt = "1.0.0"
portable-atomic = { version = "1.15.0", features = ["critical-section"] }
usbd-hid = "0.10.0"

[profile.release]
debug = 2
lto = true
opt-level = "s"

[profile.dev]
opt-level = 1
